behaviors:
  TruckAgent:
    trainer_type: sac
    hyperparameters:
      batch_size: 512
      buffer_size: 500000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      buffer_init_steps: 10000
      tau: 0.005
      steps_per_update: 20
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory:
        memory_size: 128
        sequence_length: 32
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 128
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000